<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Skill Gap Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Resume Skill Gap Analyzer</h1>

            <p class="subtitle">
                Upload your resume and analyze your skills for a selected job role.
            </p>

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <div class="form-group">

                    <label for="job_role">
                        Select Job Role
                    </label>

                    <select
                        id="job_role"
                        name="job_role"
                        required
                    >

                        <option value="">
                            -- Select Job Role --
                        </option>

                        {% for role in roles %}

                            <option value="{{ role }}">
                                {{ role }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="resume">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.docx"
                        required
                    >

                </div>


                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>

</html>
